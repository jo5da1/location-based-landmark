version: "3.9"

services:

  discover-localstack-terraform:
    #build: .
    image: landmark-localstack-terraform
    container_name: discover-localstack-terraform

    ports:
      - "4566:4566"
      - "8080:8080"

    environment:
      - SERVICES=lambda,apigateway,iam,dynamodb,s3,sqs,logs
      - DEBUG=1
      - LS_LOG=info
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
      - ./:/app
