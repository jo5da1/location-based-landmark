version: "3.9"

services:

  landmark-osm-importer-all:
      image: landmark-osm-importer-all
      container_name: landmark_osm_importer-all
      volumes:
        - ./postgres/data:/data
        - ./postgres/data/pbf:/data/pbf
        - ./postgres/data/osm:/data/osm
      environment:
        POSTGRES_HOST: ${POSTGRES_HOST}
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        PGPASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      networks:
        - landmark-shared-net


networks:
  landmark-shared-net:
    external: true