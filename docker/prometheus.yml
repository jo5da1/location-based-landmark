global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'postgres_pgrouting'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'spring-boot-ide-landmark-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'host.docker.internal:8087'
        - 'host.docker.internal:8086'
        - 'host.docker.internal:8084'

  - job_name: 'landmark-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'landmark-geo-query-engine:8087'
        - 'landmark-nearby:8086'
        - 'landmark-nearify:8084'