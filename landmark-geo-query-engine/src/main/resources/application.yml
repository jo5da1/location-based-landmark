server.port: 8087
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

spring:
  application.name: landmark-geo-query-engine
  jpa:
    #open-in-view: false
    hibernate:
      ddl-auto: none
      show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc.lob.non_contextual_creation: true
  datasource:
    platform: postgres
    driver-class-name: org.postgresql.Driver
    #url: jdbc:postgresql://localhost:5432/landmark_db
    #username: landmark_user
    #password: landmark_password
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER_NAME}
    password: ${DB_USER_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  rabbitmq:
    #host: localhost
    #port: 5672
    #username: guest
    #password: guest
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER_NAME}
    password: ${RABBIT_PASSWORD}

logging:
  level:
    org.hibernate.SQL: WARN

# rabbit queue
message.queue:
  landmark-request: message.queue.landmark.request
  landmark-response: message.queue.landmark.response
  category-request: message.queue.category.request
  category-response: message.queue.category.response



