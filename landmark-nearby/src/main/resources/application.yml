server.port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

spring:
  application.name: landmark-nearby
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER_NAME}
    password: ${RABBIT_PASSWORD}


## rabbit queue
#landmark.request.queue: landmark.request.queue
#landmark.response.queue: landmark.response.queue
#
#landmark.message.category.request: landmark.message.category.request
#landmark.message.category.response: landmark.message.category.response

# rabbitmq queue
message.queue:
  landmark-request: message.queue.landmark.request
  landmark-response: message.queue.landmark.response
  category-request: message.queue.category.request
  category-response: message.queue.category.response