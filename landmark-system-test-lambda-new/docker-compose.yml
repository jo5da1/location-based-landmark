version: "3.9"

services:

  localstack:
    image: localstack/localstack:4.14.0
    container_name: landmark-system-test-lambda-new

    ports:
      - "4566:4566"
      - "8080:8080"

    environment:
      - SERVICES=lambda,apigateway
      - DEBUG=1
      - LS_LOG=info
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=landmark-system-test
      - AWS_SECRET_ACCESS_KEY=landmark-system-test

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
      - ./:/app
