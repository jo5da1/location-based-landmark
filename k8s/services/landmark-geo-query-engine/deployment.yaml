apiVersion: apps/v1
kind: Deployment
metadata:
  name: landmark-geo-query-engine
  namespace: landmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landmark-geo-query-engine
  template:
    metadata:
      labels:
        app: landmark-geo-query-engine
    spec:
      containers:
        - name: landmark-geo-query-engine
          image: landmark-geo-query-engine
          imagePullPolicy: Never
          ports:
            - containerPort: 8087
          env:
            - name: RABBIT_HOST
              value: rabbitmq
            - name: RABBIT_PORT
              value: "5672"
            - name: RABBIT_USER_NAME
              value: "guest"
            - name: RABBIT_PASSWORD
              value: "guest"
            - name: DB_HOST
              value: postgres-0.postgres.landmark.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "landmark_db"
            - name: DB_USER_NAME
              value: "landmark_user"
            - name: DB_USER_PASSWORD
              value: "landmark_password"
